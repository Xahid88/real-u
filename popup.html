<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Real U - Fact Checker</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <img src="icons/icon128.png" alt="Real U Logo" class="logo">
      <h1>Real U</h1>
    </header>
    
    <main>
      <div class="score-card glass-panel">
        <h2>Reality Score</h2>
        <div class="score-circle">
          <svg viewBox="0 0 36 36" class="circular-chart blue">
            <path class="circle-bg"
              d="M18 2.0845
                a 15.9155 15.9155 0 0 1 0 31.831
                a 15.9155 15.9155 0 0 1 0 -31.831"
            />
            <path class="circle" id="score-circle"
              stroke-dasharray="0, 100"
              d="M18 2.0845
                a 15.9155 15.9155 0 0 1 0 31.831
                a 15.9155 15.9155 0 0 1 0 -31.831"
            />
            <text x="18" y="20.35" class="percentage" id="score-text">--%</text>
          </svg>
        </div>
        <p id="status-text">Ready to scan current page</p>
      </div>

      <button id="scan-btn" class="primary-btn">
        <span class="btn-text">Analyze Content</span>
      </button>

      <div class="details-section">
        <h3>Analysis Breakdown</h3>
        <ul class="metrics-list" id="metrics-list">
          <li class="metric-item placeholder">No data analyzed yet.</li>
        </ul>
      </div>
    </main>

    <footer>
      <p>Powered by Real U AI Engine</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
